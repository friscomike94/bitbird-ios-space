<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Space Jump</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
  </style>
</head>
<body>
<script>
'use strict';

const W = 480, H = 640;

// ── Helpers ──────────────────────────────────────────────────────────────────

function starPoints(cx, cy, r, inner, n = 5) {
  if (inner == null) inner = r * 0.42;
  const pts = [];
  for (let i = 0; i < n * 2; i++) {
    const a = (i * Math.PI / n) - Math.PI / 2;
    const radius = i % 2 === 0 ? r : inner;
    pts.push({ x: cx + Math.cos(a) * radius, y: cy + Math.sin(a) * radius });
  }
  return pts;
}

function hi() { return parseInt(localStorage.getItem('spaceJumpHi') || '0'); }
function setHi(v) { localStorage.setItem('spaceJumpHi', v); }

// ── BootScene ─────────────────────────────────────────────────────────────────

class BootScene extends Phaser.Scene {
  constructor() { super('Boot'); }

  create() {
    // Player: sleek spaceship (48×24)
    const pg = this.make.graphics({ add: false });
    pg.fillStyle(0xd0e0f0); pg.fillEllipse(24, 12, 44, 20);
    pg.fillStyle(0x40dfff); pg.fillEllipse(31, 10, 17, 13);
    pg.fillStyle(0x8090a8);
    pg.fillTriangle(16, 12, 28, 5, 28, 12);
    pg.fillTriangle(16, 12, 28, 19, 28, 12);
    pg.fillStyle(0x405060); pg.fillRect(2, 9, 10, 6);
    pg.fillStyle(0x00ffee); pg.fillCircle(3, 12, 4);
    pg.generateTexture('player', 48, 24);
    pg.destroy();

    // Thruster particle (8×8 cyan dot)
    const tg = this.make.graphics({ add: false });
    tg.fillStyle(0x00ddff); tg.fillCircle(4, 4, 4);
    tg.generateTexture('thruster', 8, 8);
    tg.destroy();

    // Star collectible (24×24)
    const sg = this.make.graphics({ add: false });
    sg.fillStyle(0xffdd00, 0.35); sg.fillCircle(12, 12, 11);
    sg.fillStyle(0xffee44); sg.fillPoints(starPoints(12, 12, 10, 4.2), true);
    sg.fillStyle(0xffffff, 0.9); sg.fillCircle(12, 12, 3);
    sg.generateTexture('star', 24, 24);
    sg.destroy();

    // Pipe segment (80×40) — tiled to form columns
    const rpg = this.make.graphics({ add: false });
    rpg.fillStyle(0x1e2c3e); rpg.fillRect(0, 0, 80, 40);
    rpg.fillStyle(0x2e3f55, 0.8); rpg.fillEllipse(18, 10, 34, 22);
    rpg.fillStyle(0x2e3f55, 0.8); rpg.fillEllipse(58, 26, 36, 24);
    rpg.fillStyle(0x131e2c, 0.9); rpg.fillEllipse(8, 32, 26, 16);
    rpg.fillStyle(0x131e2c, 0.9); rpg.fillEllipse(66, 6, 28, 14);
    rpg.lineStyle(1, 0x4a6080, 0.6); rpg.strokeRect(0, 0, 80, 40);
    rpg.generateTexture('pipe_seg', 80, 40);
    rpg.destroy();

    // Background star dots
    const b1 = this.make.graphics({ add: false });
    b1.fillStyle(0xffffff); b1.fillCircle(2, 2, 2);
    b1.generateTexture('bgs', 4, 4);
    b1.destroy();

    const b2 = this.make.graphics({ add: false });
    b2.fillStyle(0xaaccff); b2.fillCircle(3, 3, 3);
    b2.generateTexture('bgm', 6, 6);
    b2.destroy();

    // Planet (80×80)
    const plg = this.make.graphics({ add: false });
    plg.fillStyle(0x1a3060, 0.4); plg.fillCircle(40, 40, 38);
    plg.fillStyle(0x1a3060);     plg.fillCircle(40, 40, 32);
    plg.fillStyle(0x2b4880);     plg.fillEllipse(32, 32, 36, 20);
    plg.fillStyle(0x243c6a);     plg.fillEllipse(50, 48, 26, 16);
    plg.fillStyle(0x6090c0, 0.4); plg.fillEllipse(29, 28, 14, 9);
    plg.generateTexture('planet', 80, 80);
    plg.destroy();

    this.scene.start('Menu');
  }
}

// ── MenuScene ─────────────────────────────────────────────────────────────────

class MenuScene extends Phaser.Scene {
  constructor() { super('Menu'); }

  create() {
    this._bgStars = [];
    this._makeBg();

    this.add.image(W * 0.78, H * 0.28, 'planet').setScale(1.6).setAlpha(0.5);

    const title = this.add.text(W / 2, H * 0.22, 'SPACE\nJUMP', {
      fontSize: '62px', fontFamily: 'monospace', color: '#00eeff',
      align: 'center', stroke: '#002244', strokeThickness: 7,
      shadow: { offsetX: 0, offsetY: 0, color: '#00aaff', blur: 22, fill: true }
    }).setOrigin(0.5);

    this.add.text(W / 2, H * 0.44, 'JETPACK EDITION', {
      fontSize: '13px', fontFamily: 'monospace', color: '#557799',
    }).setOrigin(0.5);

    const sub = this.add.text(W / 2, H * 0.55, '▶  HOLD TO FLY', {
      fontSize: '16px', fontFamily: 'monospace', color: '#88aacc',
    }).setOrigin(0.5);

    const btn = this.add.text(W / 2, H * 0.65, 'TAP TO START', {
      fontSize: '26px', fontFamily: 'monospace', color: '#ffffff',
      stroke: '#003366', strokeThickness: 5,
      padding: { x: 20, y: 10 }
    }).setOrigin(0.5);

    this.tweens.add({ targets: btn, alpha: 0.15, duration: 750, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    this.tweens.add({ targets: title, scaleX: 1.04, scaleY: 1.04, duration: 1600, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });

    this.add.text(W / 2, H * 0.78, `BEST: ${hi()}`, {
      fontSize: '17px', fontFamily: 'monospace', color: '#ffcc44',
    }).setOrigin(0.5);

    this.add.text(W / 2, H * 0.92, '↑ hold mouse / touch / SPACE to thrust', {
      fontSize: '11px', fontFamily: 'monospace', color: '#334455',
    }).setOrigin(0.5);

    this.input.once('pointerdown', () => this.scene.start('Game'));
    this.input.keyboard.once('keydown-SPACE', () => this.scene.start('Game'));
  }

  _makeBg() {
    for (let i = 0; i < 130; i++) {
      const s = this.add.image(
        Phaser.Math.Between(0, W), Phaser.Math.Between(0, H),
        Math.random() < 0.75 ? 'bgs' : 'bgm'
      ).setAlpha(Phaser.Math.FloatBetween(0.2, 0.9));
      s._spd = Phaser.Math.FloatBetween(0.05, 0.3);
      this._bgStars.push(s);
    }
  }

  update() {
    this._bgStars.forEach(s => { s.x -= s._spd; if (s.x < -8) s.x = W + 8; });
  }
}

// ── GameScene ─────────────────────────────────────────────────────────────────

class GameScene extends Phaser.Scene {
  constructor() { super('Game'); }

  create() {
    this._score   = 0;
    this._alive   = true;
    this._speed   = 210;
    this._gap     = 178;
    this._dist    = 0;
    this._nextPipe = 2000; // ms until first pipe
    this._elapsed  = 0;

    // Background
    this._bgLayers = [];
    this._makeBgLayers();
    this._planet = this.add.image(
      Phaser.Math.Between(W * 0.5, W * 0.95),
      Phaser.Math.Between(H * 0.05, H * 0.55),
      'planet'
    ).setAlpha(0.3).setScale(Phaser.Math.FloatBetween(0.7, 1.8));

    // Physics groups
    this._pipes  = this.physics.add.group({ allowGravity: false, runChildUpdate: false });
    this._stars  = this.physics.add.group({ allowGravity: false });

    // Player
    this._player = this.physics.add.image(W * 0.25, H * 0.5, 'player');
    this._player.setDepth(10);
    this._player.body.gravity.y = 680;
    this._player.body.maxVelocityY = 420;

    // Thruster particles (Phaser 3.60 API)
    this._emitter = this.add.particles(0, 0, 'thruster', {
      angle:    { min: 160, max: 200 },
      speed:    { min: 40,  max: 100 },
      scale:    { start: 0.9, end: 0 },
      alpha:    { start: 1,   end: 0 },
      tint:     [0x00ffff, 0x0088ff, 0x0044bb],
      lifespan: 180,
      frequency: 25,
      emitting:  false,
    }).setDepth(9);

    // HUD
    this._scoreTxt = this.add.text(14, 14, 'SCORE: 0', {
      fontSize: '20px', fontFamily: 'monospace', color: '#00eeff',
      stroke: '#000820', strokeThickness: 4,
    }).setDepth(20);

    this._speedTxt = this.add.text(W - 14, 14, '', {
      fontSize: '13px', fontFamily: 'monospace', color: '#446688',
    }).setDepth(20).setOrigin(1, 0);

    // Colliders
    this.physics.add.overlap(this._player, this._pipes,  this._die,     null, this);
    this.physics.add.overlap(this._player, this._stars,  this._getStar, null, this);

    // Input
    this._holding = false;
    this.input.on('pointerdown', () => { this._holding = true;  });
    this.input.on('pointerup',   () => { this._holding = false; });
    this._space = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
  }

  _makeBgLayers() {
    const defs = [
      { n: 80, spd: 0.15, key: 'bgs', aRange: [0.15, 0.45] },
      { n: 40, spd: 0.35, key: 'bgs', aRange: [0.4,  0.75] },
      { n: 18, spd: 0.70, key: 'bgm', aRange: [0.5,  1.0 ] },
    ];
    defs.forEach(d => {
      for (let i = 0; i < d.n; i++) {
        const s = this.add.image(
          Phaser.Math.Between(0, W), Phaser.Math.Between(0, H), d.key
        ).setAlpha(Phaser.Math.FloatBetween(...d.aRange));
        s._spd = d.spd;
        this._bgLayers.push(s);
      }
    });
  }

  _spawnPipe() {
    const gapY = Phaser.Math.Between(
      Math.ceil(this._gap / 2) + 35,
      Math.floor(H - this._gap / 2) - 35
    );
    const topH = gapY - this._gap / 2;
    const botH = H - gapY - this._gap / 2;
    const x    = W + 50;

    const mkPipe = (y, h, origin1) => {
      const pipe = this.add.tileSprite(x, y, 80, Math.max(h, 4), 'pipe_seg').setOrigin(0.5, origin1);
      this.physics.add.existing(pipe, false);
      pipe.body.allowGravity = false;
      pipe.body.setVelocityX(-this._speed);
      pipe.body.setSize(76, Math.max(h, 4));
      this._pipes.add(pipe);
      return pipe;
    };

    const top = mkPipe(0, topH, 0);
    top._primary = true;
    top._scored  = false;
    mkPipe(H, botH, 1);

    // Star in gap (65% chance)
    if (Math.random() < 0.65) {
      const sy  = Phaser.Math.Between(gapY - ~~(this._gap * 0.3), gapY + ~~(this._gap * 0.3));
      const st  = this.physics.add.image(x, sy, 'star').setDepth(5);
      st.body.allowGravity = false;
      st.body.setVelocityX(-this._speed);
      this._stars.add(st);
      this.tweens.add({ targets: st, y: sy - 7, duration: 550, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    }
  }

  _getStar(player, star) {
    const x = star.x, y = star.y;
    star.destroy();
    this._score += 3;
    this._scoreTxt.setText(`SCORE: ${this._score}`);
    const lbl = this.add.text(x, y - 8, '+3', {
      fontSize: '15px', fontFamily: 'monospace', color: '#ffee44',
    }).setDepth(30);
    this.tweens.add({ targets: lbl, y: y - 36, alpha: 0, duration: 550, onComplete: () => lbl.destroy() });
  }

  _die() {
    if (!this._alive) return;
    this._alive = false;
    this._emitter.stop();

    this.cameras.main.shake(280, 0.013);
    this.cameras.main.flash(180, 80, 30, 120);

    this.tweens.add({
      targets: this._player, alpha: 0, angle: 200, scaleX: 2.2, scaleY: 2.2,
      duration: 380,
      onComplete: () => {
        const best = Math.max(this._score, hi());
        setHi(best);
        this.scene.start('GameOver', { score: this._score, best });
      }
    });
  }

  update(_, delta) {
    if (!this._alive) return;

    const dt = delta / 1000;
    this._elapsed += delta;
    this._dist    += this._speed * dt;

    // Scroll bg
    this._bgLayers.forEach(s => {
      s.x -= s._spd * this._speed * dt * 0.45;
      if (s.x < -8) s.x = W + 8;
    });
    this._planet.x -= this._speed * dt * 0.018;
    if (this._planet.x < -100) {
      this._planet.x = W + 100;
      this._planet.y = Phaser.Math.Between(H * 0.05, H * 0.55);
    }

    // Thrust
    const thrust = this._holding || this._space.isDown;
    if (thrust) {
      this._player.body.velocity.y = Math.max(this._player.body.velocity.y - 980 * dt, -295);
    }

    // Emitter follows player
    this._emitter.setPosition(this._player.x - 26, this._player.y);
    if (thrust && !this._emitter.emitting)  this._emitter.start();
    if (!thrust && this._emitter.emitting) this._emitter.stop();

    // Tilt
    this._player.angle = Phaser.Math.Clamp(this._player.body.velocity.y * 0.062, -28, 40);

    // World bounds check (top & bottom)
    if (this._player.y <= 4 || this._player.y >= H - 4) { this._die(); return; }

    // Pipe spawning
    this._nextPipe -= delta;
    if (this._nextPipe <= 0) {
      this._spawnPipe();
      const interval = Math.max(1650 - this._dist * 0.04, 950);
      this._nextPipe = Phaser.Math.Between(~~(interval * 0.85), ~~(interval * 1.15));
    }

    // Pipes: score + cleanup
    this._pipes.getChildren().forEach(p => {
      if (!p.body) return;
      p.body.setVelocityX(-this._speed);
      if (p.x < -100) { p.destroy(); return; }
      if (p._primary && !p._scored && p.x + 40 < this._player.x) {
        p._scored = true;
        this._score += 1;
        this._scoreTxt.setText(`SCORE: ${this._score}`);
      }
    });

    // Stars cleanup
    this._stars.getChildren().forEach(s => {
      if (s.body) s.body.setVelocityX(-this._speed);
      if (s.x < -40) s.destroy();
    });

    // Progressive difficulty
    this._speed = Math.min(210 + this._dist * 0.028, 400);
    this._gap   = Math.max(178 - this._dist * 0.009, 128);

    this._speedTxt.setText(`SPD ${~~this._speed}`);
  }
}

// ── GameOverScene ─────────────────────────────────────────────────────────────

class GameOverScene extends Phaser.Scene {
  constructor() { super('GameOver'); }

  init(data) { this._score = data.score || 0; this._best = data.best || 0; }

  create() {
    this.add.rectangle(W / 2, H / 2, W, H, 0x000015, 0.75);

    for (let i = 0; i < 90; i++) {
      this.add.image(
        Phaser.Math.Between(0, W), Phaser.Math.Between(0, H),
        Math.random() < 0.75 ? 'bgs' : 'bgm'
      ).setAlpha(Phaser.Math.FloatBetween(0.2, 0.7));
    }

    const isNew = this._score > 0 && this._score >= this._best;

    const go = this.add.text(W / 2, H * 0.22, 'GAME OVER', {
      fontSize: '46px', fontFamily: 'monospace', color: '#ff4466',
      stroke: '#220011', strokeThickness: 6,
    }).setOrigin(0.5);
    this.tweens.add({ targets: go, scaleX: 1.06, scaleY: 1.06, duration: 720, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });

    this.add.text(W / 2, H * 0.40, `SCORE\n${this._score}`, {
      fontSize: '38px', fontFamily: 'monospace', color: '#00eeff', align: 'center',
    }).setOrigin(0.5);

    const bestTxt = isNew
      ? `✦ NEW BEST: ${this._best} ✦`
      : `BEST: ${this._best}`;
    const bestCol = isNew ? '#ffee00' : '#556677';
    this.add.text(W / 2, H * 0.56, bestTxt, {
      fontSize: '19px', fontFamily: 'monospace', color: bestCol,
    }).setOrigin(0.5);

    const btn = this.add.text(W / 2, H * 0.70, '▶  TAP TO PLAY AGAIN', {
      fontSize: '22px', fontFamily: 'monospace', color: '#ffffff',
      stroke: '#003355', strokeThickness: 4,
    }).setOrigin(0.5);
    this.tweens.add({ targets: btn, alpha: 0.15, duration: 750, yoyo: true, repeat: -1 });

    this.add.text(W / 2, H * 0.80, 'press M for menu', {
      fontSize: '13px', fontFamily: 'monospace', color: '#334455',
    }).setOrigin(0.5);

    this.input.once('pointerdown', () => this.scene.start('Game'));
    this.input.keyboard.once('keydown-SPACE', () => this.scene.start('Game'));
    this.input.keyboard.once('keydown-M',     () => this.scene.start('Menu'));
  }
}

// ── Boot ──────────────────────────────────────────────────────────────────────

new Phaser.Game({
  type: Phaser.AUTO,
  width: W, height: H,
  backgroundColor: '#00000e',
  physics: { default: 'arcade', arcade: { debug: false } },
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH,
  },
  scene: [BootScene, MenuScene, GameScene, GameOverScene],
});
</script>
</body>
</html>
