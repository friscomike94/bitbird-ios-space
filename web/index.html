<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Space Jump</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
  </style>
</head>
<body>
<script>
'use strict';

const W = 640, H = 480;
const BGM_KEYS  = ['bgm'];
const STAR_SFX  = ['sfx_collect', 'sfx_score', 'sfx_start'];

function starPoints(cx, cy, r, inner, n = 5) {
  if (inner == null) inner = r * 0.42;
  const pts = [];
  for (let i = 0; i < n * 2; i++) {
    const a = (i * Math.PI / n) - Math.PI / 2;
    const rad = i % 2 === 0 ? r : inner;
    pts.push({ x: cx + Math.cos(a) * rad, y: cy + Math.sin(a) * rad });
  }
  return pts;
}

function hi()     { return parseInt(localStorage.getItem('spaceJumpHi') || '0'); }
function setHi(v) { localStorage.setItem('spaceJumpHi', v); }

// ── BootScene ─────────────────────────────────────────────────────────────────
class BootScene extends Phaser.Scene {
  constructor() { super('Boot'); }

  preload() {
    this.load.audio('bgm',  'sounds/bgm.mp3');
    this.load.audio('bgm2', 'sounds/bgm2.mp3');
    this.load.audio('bgm3', 'sounds/bgm3.mp3');
    this.load.audio('bgm4', 'sounds/bgm4.mp3');
    this.load.audio('sfx_collect', 'sounds/sfx_collect.mp3');
    this.load.audio('sfx_hit',     'sounds/sfx_hit.mp3');
    this.load.audio('sfx_score',   'sounds/sfx_score.mp3');
    this.load.audio('sfx_thrust',  'sounds/sfx_thrust.mp3');
    this.load.audio('sfx_start',   'sounds/sfx_start.mp3');

    const bar = this.add.rectangle(W/2, H/2, 0, 18, 0x00eeff).setDepth(1);
    this.add.rectangle(W/2, H/2, W * 0.55, 22, 0x112233).setDepth(0);
    this.add.text(W/2, H/2 - 34, 'LOADING...', {
      fontSize: '15px', fontFamily: 'monospace', color: '#557799',
    }).setOrigin(0.5).setDepth(2);
    this.load.on('progress', v => { bar.width = W * 0.55 * v; });
  }

  create() {
    this._makePlayer();
    this._makeThruster();
    this._makeStar();
    this._makeEMField();
    this._makeBgDots();
    this._makePlanet();
    this.scene.start('Menu');
  }

  // ══ 리얼리스틱 SF 우주복 (52×60) ════════════════════════════════════════════
  _makePlayer() {
    const g = this.make.graphics({ add: false });

    // ─── 제트팩 (뒤/왼쪽) ────────────────────────────────────────
    // 메인 팩 바디
    g.fillStyle(0x232d3e); g.fillRect(0, 12, 14, 32);
    // 팩 패널 디테일
    g.fillStyle(0x1a2230); g.fillRect(2, 14, 5, 10);
    g.fillStyle(0x1a2230); g.fillRect(2, 28, 5, 12);
    // 에너지 도관 라인
    g.fillStyle(0x00aaff, 0.9); g.fillRect(8, 16, 2, 26);
    g.fillStyle(0x0055aa, 0.7); g.fillRect(9, 16, 1, 26);
    // 추진기 노즐 (3개)
    g.fillStyle(0x141c28); g.fillCircle(3, 20, 4);
    g.fillStyle(0x141c28); g.fillCircle(3, 30, 4);
    g.fillStyle(0x141c28); g.fillCircle(3, 40, 3.5);
    // 노즐 글로우 (시안)
    g.fillStyle(0x00eeff, 1.0); g.fillCircle(3, 20, 2.5);
    g.fillStyle(0x00aacc, 0.8); g.fillCircle(3, 30, 2);
    g.fillStyle(0x0088bb, 0.7); g.fillCircle(3, 40, 1.8);
    // 팩 외곽 하이라이트
    g.lineStyle(1, 0x3a4f6a, 0.8);
    g.strokeRect(0, 12, 14, 32);

    // ─── 넥링 + 어깨 ─────────────────────────────────────────────
    // 어깨 갑옷 (왼/위)
    g.fillStyle(0xa8b8cc); g.fillRect(12, 22, 8, 12);
    g.fillStyle(0x8898b0); g.fillRect(12, 22, 8, 3);
    // 넥 링
    g.fillStyle(0x7888aa); g.fillRect(16, 26, 26, 5);
    g.fillStyle(0x5a6e88); g.fillRect(18, 27, 22, 2);

    // ─── 헬멧 ─────────────────────────────────────────────────────
    // 헬멧 아우터 (흰색/연회색)
    g.fillStyle(0xe0e8f4); g.fillRoundedRect(14, 0, 30, 28, 7);
    // 헬멧 사이드 패널
    g.fillStyle(0xc8d4e8); g.fillRect(40, 6, 5, 16);
    g.fillStyle(0xb8c4d8); g.fillRect(14, 6, 4, 16);
    // 바이저 프레임
    g.fillStyle(0x3a4e68); g.fillRoundedRect(17, 6, 24, 18, 4);
    // 바이저 유리 (어두운 틴트)
    g.fillStyle(0x060d1e); g.fillRoundedRect(19, 8, 20, 14, 3);
    // 바이저 반사광 1 (밝은 사선 줄기)
    g.fillStyle(0xffffff, 0.45); g.fillRect(20, 9, 9, 3);
    g.fillStyle(0xffffff, 0.25); g.fillRect(21, 12, 6, 2);
    // 바이저 환경 반사 (희미한 시안 빛)
    g.fillStyle(0x00aaff, 0.12); g.fillRect(20, 15, 18, 6);
    // 헬멧 상단 상태 표시등
    g.fillStyle(0x00ff88); g.fillCircle(28, 2, 2);  // 녹색 = 정상
    g.fillStyle(0xff4444); g.fillCircle(34, 2, 2);  // 빨강 경고
    // 안테나
    g.fillStyle(0xb0bece); g.fillRect(36, -5, 2, 7);
    g.fillStyle(0xff3333); g.fillCircle(37, -5, 2.5);  // 빨간 불빛

    // ─── 수트 몸통 ────────────────────────────────────────────────
    // 메인 토르소 (라이트 그레이, 갑옷 패널)
    g.fillStyle(0xc8d4e4); g.fillRect(14, 30, 30, 24);
    // 어깨 갑옷 (오른쪽, 위)
    g.fillStyle(0xb0bece); g.fillRoundedRect(40, 28, 8, 14, 2);
    g.fillStyle(0xa0aebe); g.fillRect(40, 28, 8, 3);
    // 흉갑 (체스트 플레이트)
    g.fillStyle(0x4a6490); g.fillRect(18, 32, 24, 16);
    // 흉갑 글로우 라인
    g.fillStyle(0x00ffdd); g.fillRect(18, 42, 24, 2);
    g.fillStyle(0x00ccaa, 0.6); g.fillRect(18, 44, 24, 1);
    // 시스템 인디케이터 (흉갑 상단)
    g.fillStyle(0x00ff88); g.fillRect(19, 33, 4, 4);  // 녹색
    g.fillStyle(0xffaa00); g.fillRect(25, 33, 4, 4);  // 황색
    g.fillStyle(0x00aaff); g.fillRect(31, 33, 4, 4);  // 파랑
    // 인디케이터 레이블 (작은 흰 픽셀)
    g.fillStyle(0xffffff, 0.5);
    g.fillRect(20, 34, 2, 2);
    g.fillRect(26, 34, 2, 2);
    g.fillRect(32, 34, 2, 2);
    // 유틸리티 벨트
    g.fillStyle(0x3a4e68); g.fillRect(14, 52, 30, 5);
    g.fillStyle(0x2a3a50); g.fillRect(16, 53, 7, 3);  // 파우치
    g.fillStyle(0x2a3a50); g.fillRect(26, 53, 7, 3);
    g.fillStyle(0x2a3a50); g.fillRect(36, 53, 5, 3);

    // ─── 오른팔 (가시적) ────────────────────────────────────────
    g.fillStyle(0xb8c8dc); g.fillRect(42, 32, 10, 12);  // 상완
    g.fillStyle(0xa8b8cc); g.fillRect(42, 42, 10, 10);  // 하완
    // 건틀렛 글로우 스트라이프
    g.fillStyle(0x00ddff); g.fillRect(42, 47, 10, 2);
    // 건틀렛 (손)
    g.fillStyle(0x8898b0); g.fillRect(42, 52, 10, 5);

    // ─── 다리 ────────────────────────────────────────────────────
    g.fillStyle(0xb0bcd0); g.fillRect(16, 57, 10, 10);  // 왼다리
    g.fillStyle(0xb0bcd0); g.fillRect(30, 57, 10, 10);  // 오른다리
    // 부트
    g.fillStyle(0x6878a0); g.fillRect(15, 65, 12, 5);
    g.fillStyle(0x6878a0); g.fillRect(29, 65, 12, 5);
    // 부트 밑창
    g.fillStyle(0x3a4860); g.fillRect(15, 68, 12, 2);
    g.fillStyle(0x3a4860); g.fillRect(29, 68, 12, 2);

    g.generateTexture('player', 52, 70);
    g.destroy();
  }

  // ══ 전자기장 파이프 세그먼트 (90×40) ════════════════════════════════════════
  _makeEMField() {
    const g = this.make.graphics({ add: false });
    const W2 = 90, H2 = 40;

    // 기본 어두운 에너지 베이스
    g.fillStyle(0x010818); g.fillRect(0, 0, W2, H2);

    // 에너지 그리드 (수평)
    [8, 16, 24, 32].forEach(y => {
      g.fillStyle(0x003355, 0.7); g.fillRect(0, y, W2, 1);
    });
    // 에너지 그리드 (수직)
    for (let x = 10; x < W2; x += 14) {
      g.fillStyle(0x003355, 0.6); g.fillRect(x, 0, 1, H2);
    }

    // 그리드 교차점 노드
    [8, 16, 24, 32].forEach(y => {
      for (let x = 10; x < W2; x += 14) {
        g.fillStyle(0x0077bb, 0.9); g.fillCircle(x, y, 1.5);
      }
    });

    // ─── 상단 엣지 글로우 (가장 중요 - 내부 경계) ─────────────────
    g.fillStyle(0x00ffff, 0.08); g.fillRect(0, 0, W2, 10);   // 외부 헤일로
    g.fillStyle(0x00ddff, 0.25); g.fillRect(0, 0, W2, 5);    // 미드 글로우
    g.fillStyle(0x00ffff, 0.70); g.fillRect(0, 0, W2, 2);    // 밝은 선
    g.fillStyle(0xffffff, 1.00); g.fillRect(0, 0, W2, 1);    // 흰 엣지

    // ─── 하단 엣지 글로우 ──────────────────────────────────────────
    g.fillStyle(0x00ffff, 0.08); g.fillRect(0, H2 - 10, W2, 10);
    g.fillStyle(0x00ddff, 0.25); g.fillRect(0, H2 - 5,  W2, 5);
    g.fillStyle(0x00ffff, 0.70); g.fillRect(0, H2 - 2,  W2, 2);
    g.fillStyle(0xffffff, 1.00); g.fillRect(0, H2 - 1,  W2, 1);

    // ─── 좌우 엣지 보라색 글로우 ───────────────────────────────────
    g.fillStyle(0x9900ff, 0.5); g.fillRect(0,      0, 3, H2);
    g.fillStyle(0x6600cc, 0.3); g.fillRect(0,      0, 6, H2);
    g.fillStyle(0x9900ff, 0.5); g.fillRect(W2 - 3, 0, 3, H2);
    g.fillStyle(0x6600cc, 0.3); g.fillRect(W2 - 6, 0, 6, H2);

    // ─── 에너지 사선 스트리크 ──────────────────────────────────────
    g.fillStyle(0x00eeff, 0.06); g.fillTriangle(0, 0, 28, 0, 0, H2);
    g.fillStyle(0xaa00ff, 0.05); g.fillTriangle(W2, 0, W2 - 28, 0, W2, H2);

    // ─── 스캔라인 오버레이 ──────────────────────────────────────────
    for (let y = 4; y < H2; y += 4) {
      g.fillStyle(0x000000, 0.12); g.fillRect(0, y, W2, 1);
    }

    g.generateTexture('pipe_seg', W2, H2);
    g.destroy();

    // ─── 방출구 노드 텍스처 (파이프 끝 이미터) ─────────────────────
    const ng = this.make.graphics({ add: false });
    ng.fillStyle(0x000818); ng.fillCircle(12, 12, 12);
    ng.fillStyle(0x00aaff, 0.4); ng.fillCircle(12, 12, 10);
    ng.fillStyle(0x00ffff, 0.7); ng.fillCircle(12, 12, 7);
    ng.fillStyle(0xffffff, 1.0); ng.fillCircle(12, 12, 4);
    ng.fillStyle(0x00ffff, 0.3); ng.fillCircle(12, 12, 14);
    ng.generateTexture('em_node', 24, 24);
    ng.destroy();
  }

  _makeThruster() {
    const g = this.make.graphics({ add: false });
    g.fillStyle(0x00ddff); g.fillCircle(4, 4, 4);
    g.generateTexture('thruster', 8, 8);
    g.destroy();
  }

  _makeStar() {
    const g = this.make.graphics({ add: false });
    g.fillStyle(0xffdd00, 0.3); g.fillCircle(12, 12, 11);
    g.fillStyle(0xffee44); g.fillPoints(starPoints(12, 12, 10, 4), true);
    g.fillStyle(0xffffff, 0.85); g.fillCircle(12, 12, 3);
    g.generateTexture('star', 24, 24);
    g.destroy();
  }

  _makeBgDots() {
    const g1 = this.make.graphics({ add: false });
    g1.fillStyle(0xffffff); g1.fillCircle(2, 2, 2);
    g1.generateTexture('bgs', 4, 4); g1.destroy();

    const g2 = this.make.graphics({ add: false });
    g2.fillStyle(0xaaccff); g2.fillCircle(3, 3, 3);
    g2.generateTexture('bgm_dot', 6, 6); g2.destroy();
  }

  _makePlanet() {
    const g = this.make.graphics({ add: false });
    g.fillStyle(0x1a3060, 0.35); g.fillCircle(40, 40, 38);
    g.fillStyle(0x1a3060);       g.fillCircle(40, 40, 32);
    g.fillStyle(0x2b4880);       g.fillEllipse(32, 30, 38, 22);
    g.fillStyle(0x243c6a);       g.fillEllipse(50, 50, 26, 14);
    g.fillStyle(0x6090c0, 0.35); g.fillEllipse(27, 26, 16, 9);
    g.lineStyle(3, 0x4a70a0, 0.4); g.strokeEllipse(40, 40, 90, 22);
    g.generateTexture('planet', 80, 80);
    g.destroy();
  }
}

// ── MenuScene ─────────────────────────────────────────────────────────────────
class MenuScene extends Phaser.Scene {
  constructor() { super('Menu'); }

  create() {
    this._bgStars = [];
    this._makeBg();
    this.sound.stopAll();
    const playBgm = () => { if (!this.sound.getAll().some(s => s.isPlaying)) this.sound.play('bgm', { loop: true, volume: 0.5 }); };
    if (this.sound.locked) this.sound.once('unlocked', playBgm); else playBgm();

    this.add.image(W * 0.82, H * 0.42, 'planet').setScale(1.8).setAlpha(0.45);

    // 캐릭터 미리보기 + 글로우
    const glow = this.add.rectangle(W * 0.15, H * 0.46, 36, 46, 0x00aaff, 0.08);
    this.tweens.add({ targets: glow, alpha: 0.18, scaleX: 1.1, scaleY: 1.1, duration: 1200, yoyo: true, repeat: -1 });
    this.add.image(W * 0.15, H * 0.46, 'player').setScale(1.1).setAlpha(0.9);

    const title = this.add.text(W / 2, H * 0.18, 'SPACE JUMP', {
      fontSize: '54px', fontFamily: 'monospace', color: '#00eeff',
      stroke: '#002244', strokeThickness: 7,
      shadow: { offsetX: 0, offsetY: 0, color: '#00aaff', blur: 22, fill: true }
    }).setOrigin(0.5);

    this.add.text(W / 2, H * 0.33, 'EM  FIELD  EDITION', {
      fontSize: '13px', fontFamily: 'monospace', color: '#446688', letterSpacing: 4,
    }).setOrigin(0.5);

    this.add.text(W / 2, H * 0.45, '▶  HOLD to thrust  |  RELEASE to fall', {
      fontSize: '14px', fontFamily: 'monospace', color: '#7799bb',
    }).setOrigin(0.5);

    const btn = this.add.text(W / 2, H * 0.60, 'TAP  TO  START', {
      fontSize: '28px', fontFamily: 'monospace', color: '#ffffff',
      stroke: '#003366', strokeThickness: 5,
    }).setOrigin(0.5);

    this.tweens.add({ targets: btn,   alpha: 0.12, duration: 750, yoyo: true, repeat: -1 });
    this.tweens.add({ targets: title, scaleX: 1.03, scaleY: 1.03, duration: 1600, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });

    this.add.text(W / 2, H * 0.78, `BEST: ${hi()}`, {
      fontSize: '18px', fontFamily: 'monospace', color: '#ffcc44',
    }).setOrigin(0.5);

    this.input.once('pointerdown',       () => { this.sound.play('sfx_start', { volume: 0.75 }); this.scene.start('Game'); });
    this.input.keyboard.once('keydown-SPACE', () => { this.sound.play('sfx_start', { volume: 0.75 }); this.scene.start('Game'); });
  }

  _makeBg() {
    for (let i = 0; i < 150; i++) {
      const s = this.add.image(
        Phaser.Math.Between(0, W), Phaser.Math.Between(0, H),
        Math.random() < 0.75 ? 'bgs' : 'bgm_dot'
      ).setAlpha(Phaser.Math.FloatBetween(0.2, 0.9));
      s._spd = Phaser.Math.FloatBetween(0.05, 0.28);
      this._bgStars.push(s);
    }
  }

  update() {
    this._bgStars.forEach(s => { s.x -= s._spd; if (s.x < -8) s.x = W + 8; });
  }
}

// ── GameScene ─────────────────────────────────────────────────────────────────
class GameScene extends Phaser.Scene {
  constructor() { super('Game'); }

  create() {
    this._score     = 0;
    this._alive     = true;
    this._speed     = 160;
    this._gap       = 210;
    this._dist      = 0;
    this._nextPipe  = 3000;
    this._elapsed   = 0;
    this._pairList  = [];  // 전자기장 아크 추적용

    if (!this.sound.getAll().some(s => s.isPlaying && BGM_KEYS.includes(s.key))) {
      const playBgm = () => this.sound.play('bgm', { loop: true, volume: 0.5 });
      if (this.sound.locked) this.sound.once('unlocked', playBgm); else playBgm();
    }

    // 배경
    this._bgLayers = [];
    this._makeBgLayers();
    this._planet = this.add.image(
      Phaser.Math.Between(W * 0.55, W * 0.92),
      Phaser.Math.Between(H * 0.08, H * 0.88), 'planet'
    ).setAlpha(0.28).setScale(Phaser.Math.FloatBetween(0.6, 1.6));

    // 아크/번개 그래픽스 레이어
    this._arcGraphics = this.add.graphics().setDepth(7);

    // 물리 그룹
    this._pipes = this.physics.add.group({ allowGravity: false });
    this._stars = this.physics.add.group({ allowGravity: false });

    // 플레이어
    this._player = this.physics.add.image(W * 0.22, H * 0.5, 'player').setScale(0.5).setDepth(10);
    this._player.body.gravity.y = 420;
    this._player.body.maxVelocityY = 370;

    // 제트팩 파티클 (시안 + 파랑 믹스)
    this._emitter = this.add.particles(0, 0, 'thruster', {
      angle:    { min: 150, max: 210 },
      speed:    { min: 60, max: 130 },
      scale:    { start: 1.1, end: 0 },
      alpha:    { start: 1,   end: 0 },
      tint:     [0x00ffff, 0x0066ff, 0x00aaff, 0x00eebb, 0xffffff],
      lifespan: 200,
      frequency: 20,
      emitting:  false,
    }).setDepth(9);

    // 제트팩 사운드
    this._thrustSnd = this.sound.add('sfx_thrust', { loop: true, volume: 0.3 });

    // HUD
    this._scoreTxt = this.add.text(14, 12, 'SCORE: 0', {
      fontSize: '20px', fontFamily: 'monospace', color: '#00eeff',
      stroke: '#000820', strokeThickness: 4,
    }).setDepth(20);

    this._diffTxt = this.add.text(W - 14, 12, 'EASY', {
      fontSize: '14px', fontFamily: 'monospace', color: '#3a5568',
    }).setDepth(20).setOrigin(1, 0);

    // EM 필드 상태 표시 (우상단)
    this._emTxt = this.add.text(W - 14, 32, '⚡ EM FIELD ACTIVE', {
      fontSize: '11px', fontFamily: 'monospace', color: '#00ddff',
    }).setDepth(20).setOrigin(1, 0);
    this.tweens.add({ targets: this._emTxt, alpha: 0.3, duration: 600, yoyo: true, repeat: -1 });

    // 충돌
    this.physics.add.overlap(this._player, this._pipes, this._die,     null, this);
    this.physics.add.overlap(this._player, this._stars, this._getStar, null, this);

    // 입력
    this._holding = false;
    this.input.on('pointerdown', () => { this._holding = true; });
    this.input.on('pointerup',   () => { this._holding = false; });
    this._space = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
  }

  _makeBgLayers() {
    [
      { n: 90, spd: 0.12, key: 'bgs',     aRange: [0.12, 0.40] },
      { n: 45, spd: 0.32, key: 'bgs',     aRange: [0.35, 0.70] },
      { n: 20, spd: 0.65, key: 'bgm_dot', aRange: [0.45, 0.95] },
    ].forEach(d => {
      for (let i = 0; i < d.n; i++) {
        const s = this.add.image(
          Phaser.Math.Between(0, W), Phaser.Math.Between(0, H), d.key
        ).setAlpha(Phaser.Math.FloatBetween(...d.aRange));
        s._spd = d.spd;
        this._bgLayers.push(s);
      }
    });
  }

  _spawnPipe() {
    const margin = Math.ceil(this._gap / 2) + 28;
    const gapY   = Phaser.Math.Between(margin, H - margin);
    const topH   = gapY - this._gap / 2;
    const botH   = H - gapY - this._gap / 2;
    const x      = W + 55;

    const mkPipe = (y, h, oy) => {
      const h2   = Math.max(h, 4);
      const pipe = this.add.tileSprite(x, y, 90, h2, 'pipe_seg').setOrigin(0.5, oy);
      this.physics.add.existing(pipe, false);
      pipe.body.allowGravity = false;
      pipe.body.setVelocityX(-this._speed);
      pipe.body.setSize(82, h2);
      this._pipes.add(pipe);
      // 파이프 스폰 시 펄스 트윈
      this.tweens.add({
        targets: pipe, alpha: { from: 0, to: 1 }, duration: 300, ease: 'Quad.easeOut'
      });
      return pipe;
    };

    const top     = mkPipe(0, topH, 0);
    top._primary  = true;
    top._scored   = false;
    const bot     = mkPipe(H, botH, 1);

    // EM 이미터 노드 (파이프 내부 경계)
    const nodeTop = this.add.image(x, topH,     'em_node').setDepth(6).setAlpha(0.9);
    const nodeBot = this.add.image(x, H - botH, 'em_node').setDepth(6).setAlpha(0.9);

    // 노드 펄스 트윈
    [nodeTop, nodeBot].forEach(nd => {
      this.tweens.add({ targets: nd, scaleX: 1.3, scaleY: 1.3, alpha: 1.0, duration: 350, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    });

    // 페어 정보 저장 (아크 드로잉용)
    this._pairList.push({ top, bot, nodeTop, nodeBot, gapTop: topH, gapBot: H - botH });

    // 별 수집물
    if (Math.random() < 0.60) {
      const sy = Phaser.Math.Between(gapY - ~~(this._gap * 0.28), gapY + ~~(this._gap * 0.28));
      const st = this.physics.add.image(x, sy, 'star').setDepth(5);
      st.body.allowGravity = false;
      st.body.setVelocityX(-this._speed);
      this._stars.add(st);
      this.tweens.add({ targets: st, y: sy - 9, duration: 580, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    }
  }

  // 전자기장 번개 아크 드로우
  _drawArc(x, gapTop, gapBot) {
    const g   = this._arcGraphics;
    const t   = this._elapsed;

    // 시간 기반 색상 사이클
    const cycle = (Math.sin(t * 0.006) + 1) * 0.5;
    const cA    = 0x00ffff;  // 시안
    const cB    = 0xaa00ff;  // 보라

    for (let arc = 0; arc < 3; arc++) {
      const alpha = [0.9, 0.55, 0.3][arc];
      const lw    = [2,   1.5,  1  ][arc];
      const noise = [14,  20,   26  ][arc];
      const col   = arc === 0 ? cA : (arc === 1 ? cB : 0xffffff);

      g.lineStyle(lw, col, alpha);
      g.beginPath();
      g.moveTo(x, gapTop);

      const segments = Phaser.Math.Between(5, 9);
      for (let i = 1; i <= segments; i++) {
        const ty  = gapTop + (gapBot - gapTop) * (i / segments);
        const ox  = (Math.random() - 0.5) * noise * 2;
        g.lineTo(x + ox, ty);
      }
      g.strokePath();
    }

    // 이미터 노드 글로우 (아크 그래픽스에 직접)
    g.fillStyle(0xffffff, 0.9); g.fillCircle(x, gapTop, 3.5);
    g.fillStyle(0x00ffff, 0.5); g.fillCircle(x, gapTop, 8);
    g.fillStyle(0xffffff, 0.9); g.fillCircle(x, gapBot, 3.5);
    g.fillStyle(0x00ffff, 0.5); g.fillCircle(x, gapBot, 8);
  }

  _getStar(_, star) {
    const { x, y } = star;
    star.destroy();
    this._score += 3;
    this._scoreTxt.setText(`SCORE: ${this._score}`);
    const sfxKey = Phaser.Utils.Array.GetRandom(STAR_SFX);
    this.sound.play(sfxKey, { volume: Phaser.Math.FloatBetween(0.55, 0.85), detune: Phaser.Math.Between(-150, 150) });
    const lbl = this.add.text(x, y - 6, '+3', {
      fontSize: '16px', fontFamily: 'monospace', color: '#ffee44',
    }).setDepth(30);
    this.tweens.add({ targets: lbl, y: y - 42, alpha: 0, duration: 560, onComplete: () => lbl.destroy() });
  }

  _die() {
    if (!this._alive) return;
    this._alive = false;
    this._emitter.stop();
    if (this._thrustSnd.isPlaying) this._thrustSnd.stop();
    this.sound.play('sfx_hit', { volume: 0.95 });
    this.cameras.main.shake(300, 0.014);
    this.cameras.main.flash(200, 90, 30, 130);
    this.tweens.add({
      targets: this._player, alpha: 0, angle: 220, scaleX: 2.3, scaleY: 2.3,
      duration: 400,
      onComplete: () => {
        const best = Math.max(this._score, hi());
        setHi(best);
        this.scene.start('GameOver', { score: this._score, best });
      }
    });
  }

  _diffLabel() {
    const s = this._speed;
    if (s < 200) return 'EASY';
    if (s < 245) return 'NORMAL';
    if (s < 285) return 'HARD';
    return '⚡INSANE';
  }

  update(_, delta) {
    if (!this._alive) return;

    const dt = delta / 1000;
    this._elapsed += delta;
    this._dist    += this._speed * dt;

    // 배경 스크롤
    this._bgLayers.forEach(s => {
      s.x -= s._spd * this._speed * dt * 0.40;
      if (s.x < -8) s.x = W + 8;
    });
    this._planet.x -= this._speed * dt * 0.015;
    if (this._planet.x < -120) {
      this._planet.x = W + 120;
      this._planet.y = Phaser.Math.Between(H * 0.08, H * 0.88);
    }

    // 추력
    const thrust = this._holding || this._space.isDown;
    if (thrust) {
      this._player.body.velocity.y = Math.max(this._player.body.velocity.y - 840 * dt, -252);
    }

    // 제트팩 사운드
    if (thrust && !this._thrustSnd.isPlaying) this._thrustSnd.play();
    if (!thrust && this._thrustSnd.isPlaying)  this._thrustSnd.stop();

    // 파티클
    this._emitter.setPosition(this._player.x - 10, this._player.y + 8);
    if (thrust && !this._emitter.emitting)  this._emitter.start();
    if (!thrust && this._emitter.emitting) this._emitter.stop();

    // 기울기 (수트 기준으로 자연스럽게)
    this._player.angle = Phaser.Math.Clamp(this._player.body.velocity.y * 0.055, -22, 36);

    // 화면 경계
    if (this._player.y <= 4 || this._player.y >= H - 4) { this._die(); return; }

    // ─── 전자기장 색상 사이클 ──────────────────────────────────────
    const t   = this._elapsed;
    const sin = (Math.sin(t * 0.0025) + 1) * 0.5;
    const r   = ~~Phaser.Math.Linear(0,   180, sin);
    const gv  = ~~Phaser.Math.Linear(220,  60, sin);
    const b   = 255;
    const tintColor = Phaser.Display.Color.GetColor(r, gv, b);
    this._pipes.getChildren().forEach(p => { if (p.active) p.setTint(tintColor); });

    // ─── 번개 아크 그리기 ──────────────────────────────────────────
    this._arcGraphics.clear();
    // 쓸모없는 페어 제거
    this._pairList = this._pairList.filter(pair => pair.top.active);
    this._pairList.forEach(pair => {
      const px = pair.top.x;
      if (px < -60 || px > W + 80) return;
      // 페어의 EM 노드 이동
      pair.nodeTop.x = px;
      pair.nodeBot.x = px;
      // 아크 드로우 (파이프 우측 엣지 - 갭 입구)
      this._drawArc(px + 45, pair.gapTop, pair.gapBot);
    });

    // 파이프 스폰
    this._nextPipe -= delta;
    if (this._nextPipe <= 0) {
      this._spawnPipe();
      const base = Math.max(2100 - this._dist * 0.025, 1200);
      this._nextPipe = Phaser.Math.Between(~~(base * 0.88), ~~(base * 1.12));
    }

    // 파이프 업데이트
    this._pipes.getChildren().forEach(p => {
      if (!p.body) return;
      p.body.setVelocityX(-this._speed);
      if (p.x < -120) { p.destroy(); return; }
      if (p._primary && !p._scored && p.x + 45 < this._player.x) {
        p._scored = true;
        this._score += 1;
        this._scoreTxt.setText(`SCORE: ${this._score}`);
        this.sound.play('sfx_score', { volume: 0.55 });
      }
    });

    // 별 업데이트
    this._stars.getChildren().forEach(s => {
      if (s.body) s.body.setVelocityX(-this._speed);
      if (s.x < -50) s.destroy();
    });

    // 난이도
    this._speed = Math.min(160 + this._dist * 0.011, 310);
    this._gap   = Math.max(210 - this._dist * 0.004, 160);
    this._diffTxt.setText(this._diffLabel());
  }
}

// ── GameOverScene ─────────────────────────────────────────────────────────────
class GameOverScene extends Phaser.Scene {
  constructor() { super('GameOver'); }
  init(data) { this._score = data.score || 0; this._best = data.best || 0; }

  create() {
    this.add.rectangle(W/2, H/2, W, H, 0x000012, 0.8);
    for (let i = 0; i < 100; i++) {
      this.add.image(
        Phaser.Math.Between(0, W), Phaser.Math.Between(0, H),
        Math.random() < 0.75 ? 'bgs' : 'bgm_dot'
      ).setAlpha(Phaser.Math.FloatBetween(0.2, 0.65));
    }

    const isNew = this._score > 0 && this._score >= this._best;

    // 캐릭터 (tilted)
    this.add.image(W/2, H * 0.16, 'player').setScale(1.0).setAlpha(0.75).setAngle(18);

    const go = this.add.text(W/2, H*0.32, 'GAME  OVER', {
      fontSize: '44px', fontFamily: 'monospace', color: '#ff4466',
      stroke: '#220011', strokeThickness: 6,
    }).setOrigin(0.5);
    this.tweens.add({ targets: go, scaleX: 1.06, scaleY: 1.06, duration: 700, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });

    this.add.text(W/2, H*0.50, `SCORE   ${this._score}`, {
      fontSize: '34px', fontFamily: 'monospace', color: '#00eeff',
    }).setOrigin(0.5);

    this.add.text(W/2, H*0.62,
      isNew ? `✦  NEW  BEST :  ${this._best}  ✦` : `BEST:  ${this._best}`, {
      fontSize: '20px', fontFamily: 'monospace',
      color: isNew ? '#ffee00' : '#445566',
    }).setOrigin(0.5);

    const btn = this.add.text(W/2, H*0.76, '▶   TAP TO PLAY AGAIN', {
      fontSize: '22px', fontFamily: 'monospace', color: '#ffffff',
      stroke: '#003355', strokeThickness: 4,
    }).setOrigin(0.5);
    this.tweens.add({ targets: btn, alpha: 0.12, duration: 750, yoyo: true, repeat: -1 });

    this.add.text(W/2, H*0.88, 'M = menu', {
      fontSize: '12px', fontFamily: 'monospace', color: '#2a3f55',
    }).setOrigin(0.5);

    this.input.once('pointerdown',        () => this.scene.start('Game'));
    this.input.keyboard.once('keydown-SPACE', () => this.scene.start('Game'));
    this.input.keyboard.once('keydown-M',     () => this.scene.start('Menu'));
  }
}

// ── Launch ────────────────────────────────────────────────────────────────────
new Phaser.Game({
  type: Phaser.AUTO,
  width: W, height: H,
  backgroundColor: '#00000c',
  physics: { default: 'arcade', arcade: { debug: false } },
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [BootScene, MenuScene, GameScene, GameOverScene],
});
