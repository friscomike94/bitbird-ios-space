<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>I Am Thinking Of You</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
canvas#game {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<img id="charImg" src="character.gif" style="display:none;" alt="">

<script>
'use strict';

// ── Canvas setup ──────────────────────────────────────────────
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
const charImg = document.getElementById('charImg');
const offCanvas = document.createElement('canvas');
const offCtx    = offCanvas.getContext('2d', { willReadFrequently: true });
offCanvas.width  = 320;
offCanvas.height = 320;

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ── Constants ────────────────────────────────────────────────
const BPM          = 150;
const BEAT_S       = 60 / BPM;          // 0.4s per beat
const UNLOCK_RAMP  = BEAT_S * 2;        // 0.8s gain ramp
const CHAR_W       = 200;
const CHAR_H       = 200;

// Vanishing point = top-centre at 25% height
function vp() { return { x: canvas.width / 2, y: canvas.height * 0.25 }; }

const STEMS = [
  { file: 'sounds/guitar_ac.mp3',       label: 'GUITAR AC',       startGain: 1 },
  { file: 'sounds/bass.mp3',            label: 'BASS',            startGain: 0 },
  { file: 'sounds/guitar_baritone.mp3', label: 'GUITAR BARITONE', startGain: 0 },
  { file: 'sounds/synth_drone.mp3',     label: 'SYNTH DRONE',     startGain: 0 },
  { file: 'sounds/synth_lead.mp3',      label: 'SYNTH LEAD',      startGain: 0 },
  { file: 'sounds/guitar_main.mp3',     label: 'GUITAR MAIN',     startGain: 0 },
  { file: 'sounds/strings.mp3',         label: 'STRINGS',         startGain: 0 },
  { file: 'sounds/fx.mp3',              label: 'FX',              startGain: 0 },
  { file: 'sounds/vox1.mp3',            label: 'VOX 1',           startGain: 0 },
  { file: 'sounds/vox2.mp3',            label: 'VOX 2',           startGain: 0 },
];

let wallDepth = 0.85;

// ── Game state ───────────────────────────────────────────────
const SCENE = { TITLE: 0, PLAYING: 1, BREAKING: 2, WALKING: 3, FINALE: 4 };
let scene        = SCENE.TITLE;
let currentWall  = 0;     // 0-8 (9 walls)
let charOffsetY  = 0;     // walk animation offset (px, positive = up)
let chargeLevel  = 0;     // 0-1
let isHolding    = false;
let chargeStart  = 0;
let particles    = [];
let waveRings    = [];
let walkStart    = 0;
let finaleStart  = 0;
let unlockedDots = 1;     // guitar_ac starts unlocked
let frameDt      = 0.016; // updated each loop tick, used by drawParticles
let flashAlpha   = 0;

// ── Audio ─────────────────────────────────────────────────────
let audioCtx   = null;
let gainNodes  = [];
let audioReady = false;

// ── RAF loop ─────────────────────────────────────────────────
let lastTime = 0;
let charFrameFrozen = false; // true after first GIF frame captured

function loop(ts) {
  frameDt  = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  try {
    update(frameDt, ts);
    draw(ts);
  } catch(e) {
    console.error('Game loop error:', e);
  }
  requestAnimationFrame(loop);
}

// ── Renderers ────────────────────────────────────────────────

function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0,   '#020010');
  grad.addColorStop(0.5, '#0a0028');
  grad.addColorStop(1,   '#14002a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawStars(ts) {
  const seed = 42;
  for (let i = 0; i < 80; i++) {
    const t  = (seed * (i + 1) * 1.618) % 1;
    const t2 = (seed * (i + 1) * 3.141) % 1;
    const t3 = (seed * (i + 1) * 2.718) % 1;
    const x  = (t  * canvas.width);
    const y  = (t2 * canvas.height * 0.7);
    const r  = 0.5 + t3 * 1.2;
    const blink = 0.3 + 0.5 * Math.sin(ts * 0.001 * (1 + t3 * 2) + i);
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${blink.toFixed(2)})`;
    ctx.fill();
  }
}

function drawTunnel() {
  const v = vp();
  const floorY = canvas.height - canvas.height * 0.22;
  const sides  = canvas.width * 0.05;

  ctx.strokeStyle = 'rgba(255,40,200,0.18)';
  ctx.lineWidth   = 1;

  ctx.beginPath();
  ctx.moveTo(v.x, v.y);
  ctx.lineTo(sides, floorY);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(v.x, v.y);
  ctx.lineTo(canvas.width - sides, floorY);
  ctx.stroke();

  const topW = canvas.width * 0.35;
  ctx.beginPath();
  ctx.moveTo(v.x - topW / 2, v.y);
  ctx.lineTo(v.x + topW / 2, v.y);
  ctx.stroke();
}

function drawFloorGrid() {
  const floorY = canvas.height - canvas.height * 0.22;
  const h      = canvas.height - floorY;

  ctx.strokeStyle = 'rgba(255,40,200,0.15)';
  ctx.lineWidth   = 1;
  const v = vp();
  const cols = 10;
  for (let i = 0; i <= cols; i++) {
    const t  = i / cols;
    const bx = t * canvas.width;
    ctx.beginPath();
    ctx.moveTo(v.x + (bx - v.x) * 0.05, floorY);
    ctx.lineTo(bx, canvas.height);
    ctx.stroke();
  }

  const rows = 6;
  for (let i = 0; i <= rows; i++) {
    const t  = i / rows;
    const y  = floorY + t * h;
    const xL = v.x + (0 - v.x) * (1 - t * 0.95);
    const xR = v.x + (canvas.width - v.x) * (1 - t * 0.95);
    ctx.globalAlpha = 0.1 + t * 0.1;
    ctx.beginPath();
    ctx.moveTo(xL, y);
    ctx.lineTo(xR, y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawWall(depth, label) {
  const v      = vp();
  const floorY = canvas.height - canvas.height * 0.22;
  const sides  = canvas.width * 0.05;

  const t   = 1 - depth;
  const top = v.y  + (floorY - 80 - v.y)  * t;
  const bot = v.y  + (floorY - v.y)        * t;
  const xL  = v.x  + (sides - v.x)         * t;
  const xR  = v.x  + (canvas.width - sides - v.x) * t;

  const alpha = 0.3 + t * 0.6;

  ctx.fillStyle = `rgba(100,0,120,${(alpha * 0.4).toFixed(2)})`;
  ctx.beginPath();
  ctx.moveTo(xL, top);
  ctx.lineTo(xR, top);
  ctx.lineTo(xR, bot);
  ctx.lineTo(xL, bot);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = `rgba(255,60,220,${alpha.toFixed(2)})`;
  ctx.lineWidth   = 2 + t * 2;
  ctx.shadowColor  = '#ff40cc';
  ctx.shadowBlur   = 8 + t * 16 + getBeatPulse() * 12;
  ctx.stroke();
  ctx.shadowBlur   = 0;

  if (depth < 0.8 && label) {
    const fontSize = Math.round(10 + t * 18);
    ctx.font      = `700 ${fontSize}px 'Helvetica Neue', Arial, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(255,128,238,${(t * 1.2).toFixed(2)})`;
    ctx.shadowColor = '#ff40cc';
    ctx.shadowBlur  = 12;
    ctx.fillText('🎸 ' + label + ' LOCKED', v.x, (top + bot) / 2 + fontSize * 0.35);
    ctx.shadowBlur  = 0;
  }
}

async function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') await audioCtx.resume();

  const startTime = audioCtx.currentTime + 0.3;

  const buffers = await Promise.all(
    STEMS.map(s => fetch(s.file).then(r => r.arrayBuffer()).then(b => audioCtx.decodeAudioData(b)))
  );

  buffers.forEach((buf, i) => {
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(STEMS[i].startGain, audioCtx.currentTime);
    gain.connect(audioCtx.destination);
    gainNodes[i] = gain;

    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.loop   = true;
    src.connect(gain);
    src.start(startTime);
  });

  audioReady = true;
}

function unlockStem(index) {
  if (!audioCtx || index >= gainNodes.length) return;
  gainNodes[index].gain.linearRampToValueAtTime(1, audioCtx.currentTime + UNLOCK_RAMP);
}

function drawChargeBar() {
  if (scene !== SCENE.PLAYING) return;
  const barW = canvas.width * 0.5;
  const barH = 4;
  const x    = (canvas.width - barW) / 2;
  const y    = canvas.height - CHAR_H - charOffsetY - 20; // just above character

  ctx.fillStyle = 'rgba(255,40,200,0.12)';
  ctx.fillRect(x, y, barW, barH);

  const fillW = barW * chargeLevel;
  if (fillW >= 1) {
    const grd = ctx.createLinearGradient(x, 0, x + barW, 0);
    grd.addColorStop(0, '#ff9900');
    grd.addColorStop(1, '#ff5500');
    ctx.fillStyle = grd;
    ctx.shadowColor = '#ff9900';
    ctx.shadowBlur  = 6;
    ctx.fillRect(x, y, fillW, barH);
    ctx.shadowBlur = 0;
  }
}

function drawTitle() {
  const cx = canvas.width / 2;
  const cy = canvas.height * 0.42;

  ctx.textAlign   = 'center';
  ctx.font        = `300 ${Math.round(canvas.width * 0.06)}px 'Helvetica Neue', Arial, sans-serif`;
  ctx.fillStyle   = 'rgba(255,230,180,0.9)';
  ctx.shadowColor = '#ffaa40';
  ctx.shadowBlur  = 20;
  ctx.fillText('i am thinking of you', cx, cy);

  ctx.font      = `400 ${Math.round(canvas.width * 0.035)}px 'Helvetica Neue', Arial, sans-serif`;
  ctx.fillStyle = 'rgba(200,150,80,0.7)';
  ctx.shadowBlur = 8;
  ctx.fillText('150 BPM', cx, cy + canvas.width * 0.08);

  const blink = 0.4 + 0.4 * Math.sin(performance.now() * 0.003);
  ctx.font      = `400 ${Math.round(canvas.width * 0.032)}px 'Helvetica Neue', Arial, sans-serif`;
  ctx.fillStyle = `rgba(255,160,40,${blink.toFixed(2)})`;
  ctx.shadowBlur = 6;
  ctx.fillText('hold to begin', cx, cy + canvas.width * 0.19);
  ctx.shadowBlur = 0;
}

function drawFinale(ts) {
  const cx      = canvas.width / 2;
  const elapsed = (performance.now() - finaleStart) / 1000;

  // Expanding warm light rings
  for (let i = 0; i < 5; i++) {
    const phase = (elapsed * 0.7 + i * 0.4) % 3;
    const t     = phase / 3;
    const r     = t * canvas.width * 0.9;
    const alpha = (1 - t) * 0.3;
    ctx.beginPath();
    ctx.arc(cx, canvas.height * 0.5, r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,180,60,${alpha.toFixed(2)})`;
    ctx.lineWidth   = 2;
    ctx.shadowColor = '#ffaa30';
    ctx.shadowBlur  = 20;
    ctx.stroke();
    ctx.shadowBlur  = 0;
  }

  // Fade-in text after 1.5s
  const textAlpha = Math.min(Math.max((elapsed - 1.5) / 1.5, 0), 1);
  if (textAlpha > 0) {
    ctx.textAlign   = 'center';
    ctx.font        = `300 ${Math.round(canvas.width * 0.06)}px 'Helvetica Neue', Arial, sans-serif`;
    ctx.fillStyle   = `rgba(255,230,180,${textAlpha.toFixed(2)})`;
    ctx.shadowColor = '#ffaa40';
    ctx.shadowBlur  = 24;
    ctx.fillText('i am thinking of you', cx, canvas.height * 0.38);

    ctx.font      = `400 ${Math.round(canvas.width * 0.034)}px 'Helvetica Neue', Arial, sans-serif`;
    ctx.fillStyle = `rgba(200,160,100,${textAlpha.toFixed(2)})`;
    ctx.shadowBlur = 10;
    ctx.fillText('thank you', cx, canvas.height * 0.38 + canvas.width * 0.1);
    ctx.shadowBlur = 0;
  }
}

function drawStemDots() {
  const total  = STEMS.length;
  const dotR   = 4;
  const gap    = 14;
  const totalW = total * (dotR * 2) + (total - 1) * (gap - dotR * 2);
  let x = (canvas.width - totalW) / 2;
  const y = 18;

  for (let i = 0; i < total; i++) {
    const on = i < unlockedDots;
    ctx.beginPath();
    ctx.arc(x + dotR, y, dotR, 0, Math.PI * 2);
    if (on) {
      ctx.fillStyle   = '#ff9900';
      ctx.shadowColor = '#ff9900';
      ctx.shadowBlur  = 8;
    } else {
      ctx.fillStyle  = 'rgba(120,60,0,0.25)';
      ctx.shadowBlur = 0;
    }
    ctx.fill();
    ctx.shadowBlur = 0;

    if (!on) {
      ctx.strokeStyle = 'rgba(180,90,0,0.3)';
      ctx.lineWidth   = 1;
      ctx.stroke();
    }

    x += gap;
  }
}

function captureCharFrame() {
  if (!charImg.complete || charImg.naturalWidth === 0) return false;
  offCtx.clearRect(0, 0, 320, 320);
  offCtx.drawImage(charImg, 0, 0, 320, 320);
  // Remove teal background: min(G,B)-R > 90 cleanly separates bright teal
  // (diff ~150+) from character's blue clothing (diff ~60)
  try {
    const imageData = offCtx.getImageData(0, 0, 320, 320);
    const d = imageData.data;
    for (let i = 0; i < d.length; i += 4) {
      const r = d[i], g = d[i + 1], b = d[i + 2];
      if (Math.min(g, b) - r > 90) d[i + 3] = 0;
    }
    offCtx.putImageData(imageData, 0, 0);
  } catch(e) { /* canvas taint — draw raw */ }
  return true;
}

function positionCharacter() {
  if (!charImg.complete || charImg.naturalWidth === 0) return;

  // Capture first frame once; re-capture only during action states (animated)
  const isAction = scene === SCENE.BREAKING || scene === SCENE.WALKING ||
                   waveRings.length > 0;
  if (!charFrameFrozen) {
    if (captureCharFrame()) charFrameFrozen = true;
    else return;
  } else if (isAction) {
    captureCharFrame();
  }

  const centerX = canvas.width / 2;
  const size    = 200 + chargeLevel * 12;
  const drawX   = centerX - size / 2;
  // Character sits at very bottom, clearly below the wall
  const drawY   = canvas.height - size - charOffsetY;

  ctx.save();
  try {
    // Background is now transparent — plain source-over works
    const scale = 1 + chargeLevel * 0.05;
    ctx.translate(centerX, drawY + size * 0.5);
    ctx.scale(scale, scale);
    ctx.translate(-centerX, -(drawY + size * 0.5));
    ctx.drawImage(offCanvas, drawX, drawY, size, size);
  } finally {
    ctx.restore();
  }
}

function drawCharacterGlow() {
  if (chargeLevel < 0.05) return;
  const floorY  = canvas.height - canvas.height * 0.22;
  const centerX = canvas.width / 2;
  const charY   = floorY - 200 * 0.5 - charOffsetY; // centre of character
  const r = 40 + chargeLevel * 120;
  const grd = ctx.createRadialGradient(centerX, charY, 0, centerX, charY, r);
  grd.addColorStop(0,   `rgba(255,180,80,${(chargeLevel * 0.5).toFixed(2)})`);
  grd.addColorStop(1,   'rgba(255,140,40,0)');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.ellipse(centerX, charY, r, r * 0.5, 0, 0, Math.PI * 2);
  ctx.fill();
}

function update(dt, ts) {
  // Charge
  if (isHolding && scene === SCENE.PLAYING) {
    chargeLevel = Math.min((performance.now() - chargeStart) / 2000, 1);
  } else if (!isHolding) {
    chargeLevel = Math.max(0, chargeLevel - dt * 3);
  }

  // Wall approach — stops at 0.15 so it hovers above the character
  if (scene === SCENE.PLAYING && wallDepth > 0.15) {
    wallDepth = Math.max(0.15, wallDepth - dt * 0.28);
  }

  // Walk animation: character moves forward (up-screen) over 800ms
  if (scene === SCENE.WALKING) {
    const walkDur = 0.8;
    const t = Math.min((performance.now() - walkStart) / 1000 / walkDur, 1);
    charOffsetY = easeInOut(t) * 40;

    if (t >= 1) {
      charOffsetY = 0;
      currentWall++;
      if (currentWall >= STEMS.length - 1) {
        startFinale();
      } else {
        scene     = SCENE.PLAYING;
        wallDepth = 0.85;
      }
    }
  }
}

function draw(ts) {
  ctx.globalCompositeOperation = 'source-over'; // reset in case positionCharacter errored
  ctx.globalAlpha = 1;                          // reset in case drawFloorGrid errored
  ctx.shadowBlur  = 0;                          // reset shadow state
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBackground();
  drawStars(ts);

  if (scene === SCENE.TITLE) {
    drawTunnel();
    drawFloorGrid();
    positionCharacter();
    drawTitle();
    drawStemDots();
    return;
  }

  drawTunnel();
  drawFloorGrid();

  if (scene === SCENE.PLAYING || scene === SCENE.BREAKING) {
    const label = currentWall < STEMS.length - 1 ? STEMS[currentWall + 1].label : null;
    drawWall(wallDepth, label);
  }

  drawWaves(ts);
  drawChargeBar();
  positionCharacter();
  drawParticles(frameDt);

  // "Hold to fire" hint once wall has arrived
  if (scene === SCENE.PLAYING && wallDepth <= 0.16 && chargeLevel < 0.05) {
    const blink = 0.4 + 0.4 * Math.sin(performance.now() * 0.004);
    ctx.textAlign = 'center';
    ctx.font = `400 ${Math.round(canvas.width * 0.038)}px 'Helvetica Neue', Arial, sans-serif`;
    ctx.fillStyle = `rgba(255,160,40,${blink.toFixed(2)})`;
    ctx.shadowColor = '#ff9900';
    ctx.shadowBlur = 8;
    ctx.fillText('hold to fire', canvas.width / 2, canvas.height * 0.88);
    ctx.shadowBlur = 0;
  }

  if (flashAlpha > 0) {
    ctx.fillStyle = `rgba(255,220,180,${flashAlpha.toFixed(2)})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    flashAlpha = Math.max(0, flashAlpha - 0.04);
  }

  if (scene === SCENE.FINALE) {
    drawFinale(ts);
    positionCharacter();
  }

  drawStemDots();
}

function drawWaves(ts) {
  const centerX = canvas.width / 2;
  const originY = canvas.height - CHAR_H * 0.7; // waves burst from character centre

  waveRings = waveRings.filter(w => {
    const elapsed = (ts - w.startTs) / 1000;
    const t       = Math.min(Math.max(elapsed / w.duration, 0), 1);
    if (t >= 1) return false;

    const size   = Math.max(1, w.size0 + t * w.maxSize);
    const alpha  = (1 - t) * 0.8;
    const y      = originY - t * (originY - vp().y - 20);

    ctx.save();
    ctx.translate(centerX, y);
    ctx.scale(1, 0.35);
    ctx.beginPath();
    ctx.arc(0, 0, size / 2, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,180,60,${alpha.toFixed(2)})`;
    ctx.lineWidth   = 2 + w.power * 2;
    ctx.shadowColor = '#ffb030';
    ctx.shadowBlur  = 10;
    ctx.stroke();
    ctx.restore();

    return true;
  });
}

function fireWave() {
  // Compute power from actual hold time so quick taps still register
  const heldMs = isHolding ? (performance.now() - chargeStart) : 0;
  const power  = Math.max(chargeLevel, Math.min(heldMs / 2000, 1), 0.15);
  chargeLevel  = 0;

  const ts = performance.now();
  for (let i = 0; i < 3; i++) {
    waveRings.push({
      startTs:  ts + i * 120,
      duration: 0.7 + power * 0.6,
      size0:    20,
      maxSize:  60 + power * 200,
      power,
    });
  }
  // Always break — wave travels and hits wall regardless of distance
  setTimeout(() => breakWall(power), 350);
}

function spawnParticles(power) {
  const v      = vp();
  const count  = Math.round(20 + power * 30);
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 80 + Math.random() * 200 * power;
    particles.push({
      x:    v.x,
      y:    v.y + 40,
      vx:   Math.cos(angle) * speed,
      vy:   Math.sin(angle) * speed,
      life: 1,
      size: 2 + Math.random() * 4,
      hue:  280 + Math.random() * 60,
    });
  }
}

function drawParticles(dt) {
  particles = particles.filter(p => {
    p.x    += p.vx * dt;
    p.y    += p.vy * dt;
    p.vy   += 120 * dt;
    p.life -= dt * 1.5;
    if (p.life <= 0) return false;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${p.hue},100%,70%,${p.life.toFixed(2)})`;
    ctx.shadowColor = `hsl(${p.hue},100%,70%)`;
    ctx.shadowBlur  = 6;
    ctx.fill();
    ctx.shadowBlur  = 0;
    return true;
  });
}

function breakWall(power) {
  if (scene !== SCENE.PLAYING) return;
  scene = SCENE.BREAKING;

  flashAlpha = 0.6 + power * 0.4;
  spawnParticles(power);

  const stemIndex = currentWall + 1;
  unlockStem(stemIndex);
  unlockedDots = stemIndex + 1;

  setTimeout(() => startWalk(), 1200);
}

function startWalk() {
  scene = SCENE.WALKING;
  walkStart = performance.now();
}

function startFinale() {
  scene       = SCENE.FINALE;
  finaleStart = performance.now();
}

function easeInOut(t) {
  return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
}

function getBeatPulse() {
  if (!audioCtx) return 0;
  const beat  = (audioCtx.currentTime % BEAT_S) / BEAT_S;
  return beat < 0.15 ? (1 - beat / 0.15) : 0;
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  // Fire-and-forget audio init — never block the game loop
  if (!audioStarted) {
    audioStarted = true;
    initAudio().catch(err => console.warn('Audio init failed:', err));
  }
  if (scene === SCENE.TITLE) {
    scene     = SCENE.PLAYING;
    wallDepth = 0.85;
    return;
  }
  if (scene !== SCENE.PLAYING) return;
  isHolding   = true;
  chargeStart = performance.now();
});

canvas.addEventListener('pointerup', (e) => {
  e.preventDefault();
  if (!isHolding || scene !== SCENE.PLAYING) return;
  isHolding = false;
  fireWave();
});

canvas.addEventListener('pointerleave', () => {
  if (isHolding) { isHolding = false; fireWave(); }
});

let audioStarted = false;
scene = SCENE.TITLE;
requestAnimationFrame(loop);
</script>
